plugins {
    id 'com.cleanroommc.versioning' version '2.0.0'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '2.1.1'
    id 'signing'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

group = 'com.cleanroommc'

repositories {
    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com/'
    }
    mavenCentral()
    gradlePluginPortal()
}

def asmVersion = '9.10.1'

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'commons-codec:commons-codec:1.16.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'io.github.java-diff-utils:java-diff-utils:4.15'
    implementation "org.ow2.asm:asm:${asmVersion}"
    implementation "org.ow2.asm:asm-commons:${asmVersion}"
    implementation "org.ow2.asm:asm-tree:${asmVersion}"
    implementation "org.ow2.asm:asm-util:${asmVersion}"
    implementation 'de.undercouch.download:de.undercouch.download.gradle.plugin:5.6.0'
    implementation 'de.siegmar:fastcsv:3.0.0'

    // Forge Toolchain
    implementation 'net.minecraftforge:srgutils:0.5.3'
    implementation 'net.minecraftforge:renamer-gradle:1.1.5'

    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    website = 'https://github.com/CleanroomMC/CleanroomGradle'
    vcsUrl = 'https://github.com/CleanroomMC/CleanroomGradle.git'
    plugins {
        cleanroomGradle {
            id = "${group}.cleanroomgradle"
            implementationClass = "${group}.gradle.CleanroomGradle"
            displayName = 'CleanroomGradle'
            description = 'Gradle plugin for Cleanroom and Cleanroom-targeted mod development'
            tags.set(['minecraft', 'cleanroom', 'forge', 'modding', '1.12.2', 'asm', 'transform', 'bytecode'])
            compatibility {
                features {
                    configurationCache = true
                }
            }
        }
        cleanroomGradleSettings {
            id = "${group}.cleanroomgradle.settings"
            implementationClass = "${group}.gradle.CleanroomGradleSettings"
            displayName = 'CleanroomGradle Settings'
            description = 'Settings plugin that injects Cleanroom dependency repositories'
            tags.set(['minecraft', 'cleanroom', 'settings'])
            compatibility {
                features {
                    configurationCache = true
                }
            }
        }
    }
}

jar {
    manifest {
        attributes 'Implementation-Version': version
    }
}

test {
    useJUnitPlatform()
    systemProperty 'plugin.project.dir', rootDir.absolutePath
    systemProperty 'test.gradle.home', gradle.gradleHomeDir
    // includeBuild of this project has to resolve versioning
    systemProperty 'testkit.gradle.user.home', gradle.gradleUserHomeDir.absolutePath
}

publishing {
    publications {
        pluginMaven(MavenPublication) {
            artifactId = 'cleanroomgradle'
        }
    }
    repositories {
        maven {
            name = 'CleanroomMaven'
            url = 'https://maven.cleanroommc.com'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

def signingKey = providers.gradleProperty('signingKey')
def signingPassword = providers.gradleProperty('signingPassword')

signing {
    required = {
        gradle.taskGraph.allTasks.any {
            it.name == 'publishPlugins'
        }
    }
    if (signingKey.present && signingPassword.present) {
        useInMemoryPgpKeys(signingKey.get(), signingPassword.get())
    }
}
